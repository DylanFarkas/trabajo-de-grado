        let tone = "stone";
        if (amenity === "library") tone = "library";
        else if (amenity === "restaurant" || amenity === "cafe") tone = "food";
        else if (amenity === "theatre") tone = "culture";
        else if (props.leisure || amenity === "sports_centre") tone = "sport";
        else if (height_m >= 24) tone = "tower";
        else if (height_m >= 14) tone = "mid";
        const label = props["addr:housenumber"] || props["addr:housename"] || props.name || "";
        return {
          ...feature,
          properties: { ...props, height_m, tone, label: String(label) },
        };
      }),
    };
    const paths = readJson("paths");
    const passages = readJson("pasillos");

    const DAY_STYLE = "https://tiles.openfreemap.org/styles/liberty";
    const NIGHT_STYLE = "https://tiles.openfreemap.org/styles/dark";
    const LIT_ROADS = new Set([
      "Avenida Garcés",
      "Vía Circunvalar Universitaria",
      "Carrera 86",
      "Calle 13",
    ]);
    const M_LAT = 110540;
    const M_LON = 111320 * Math.cos((3.37415 * Math.PI) / 180);
    const CAMPUS = { minLon: -76.53756, maxLon: -76.52904, minLat: 3.36814, maxLat: 3.38015 };

    function lineLength(coords) {
      let len = 0;
      for (let i = 1; i < coords.length; i++) {
        const dx = (coords[i][0] - coords[i - 1][0]) * M_LON;
        const dy = (coords[i][1] - coords[i - 1][1]) * M_LAT;
        len += Math.hypot(dx, dy);
      }
      return len;
    }

    function insideCampus(lon, lat) {
      return lon >= CAMPUS.minLon && lon <= CAMPUS.maxLon && lat >= CAMPUS.minLat && lat <= CAMPUS.maxLat;
    }

    function offsetLngLat(lon, lat, east, north) {
      return [lon + east / M_LON, lat + north / M_LAT];
    }

    function boxPolygon(lon, lat, ax, ay, length, width) {
      const px = -ay;
      const py = ax;
      const halfL = length / 2;
      const halfW = width / 2;
      const ring = [
        [-halfL, -halfW],
        [halfL, -halfW],
        [halfL, halfW],
        [-halfL, halfW],
      ].map(([along, side]) => offsetLngLat(lon, lat, ax * along + px * side, ay * along + py * side));
      ring.push(ring[0]);
      return ring;
    }

    function squarePolygon(lon, lat, size) {
      const h = size / 2;
      const ring = [
        offsetLngLat(lon, lat, -h, -h),
        offsetLngLat(lon, lat, h, -h),
        offsetLngLat(lon, lat, h, h),
        offsetLngLat(lon, lat, -h, h),
      ];
      ring.push(ring[0]);
      return ring;
    }

    function ovalPolygon(lon, lat, ax, ay, length, width) {
      const px = -ay;
      const py = ax;
      const ring = [];
      const steps = 10;
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const along = Math.cos(a) * (length / 2);
        const side = Math.sin(a) * (width / 2);
        ring.push(offsetLngLat(lon, lat, ax * along + px * side, ay * along + py * side));
      }
      ring.push(ring[0]);
      return ring;
    }

    function lampPart(ring, part, base, height) {
      return {
        type: "Feature",
        properties: { part, base, height },
        geometry: { type: "Polygon", coordinates: [ring] },
      };
    }

    const LAMP_KINDS = {
      street: { spacing: 32, minSep: 22, roadside: 4.6, radius: 20 },
      park: { spacing: 22, minSep: 15, roadside: 1.7, radius: 12 },
    };

    function buildLamps(collection) {
      const posts = [];

      function accept(kind, lon, lat, ux, uy, side) {
        if (!insideCampus(lon, lat)) return;
        const minSep = LAMP_KINDS[kind].minSep;
        for (let i = 0; i < posts.length; i++) {
          const dx = (lon - posts[i].lon) * M_LON;
          const dy = (lat - posts[i].lat) * M_LAT;
          if (dx * dx + dy * dy < minSep * minSep) return;
        }
        posts.push({ kind, lon, lat, ux, uy, side });
      }

      function placeAlong(kind, coords) {
        const { spacing, roadside } = LAMP_KINDS[kind];
        if (lineLength(coords) < 14) return;
        let carry = spacing * 0.5;
        let side = 1;
        for (let i = 1; i < coords.length; i++) {
          const a = coords[i - 1];
          const b = coords[i];
          const dx = (b[0] - a[0]) * M_LON;
          const dy = (b[1] - a[1]) * M_LAT;
          const seg = Math.hypot(dx, dy);
          if (seg < 0.4) continue;
          const ux = dx / seg;
          const uy = dy / seg;
          let dist = carry;
          while (dist <= seg) {
            const t = dist / seg;
            const px = -uy * side;
            const py = ux * side;
            const lon = a[0] + (b[0] - a[0]) * t + (px * roadside) / M_LON;
            const lat = a[1] + (b[1] - a[1]) * t + (py * roadside) / M_LAT;
            accept(kind, lon, lat, ux, uy, side);
            if (kind === "street") side = -side;
            dist += spacing;
          }
          carry = dist - seg;
        }
      }

      const streetLines = [];
      const parkLines = [];
      for (const feature of collection.features || []) {
        const props = feature.properties || {};
        const geometry = feature.geometry;
        if (!geometry) continue;
        const lines = geometry.type === "LineString"
          ? [geometry.coordinates]
          : geometry.type === "MultiLineString"
            ? geometry.coordinates
            : [];
        for (const coords of lines) {
          if (coords.length < 2) continue;
          const highway = props.highway;
          if (LIT_ROADS.has(props.name) || highway === "service") streetLines.push(coords);
          else if (highway === "pedestrian" || highway === "footway" || highway === "path") {
            if (lineLength(coords) >= 25) parkLines.push(coords);
          }
        }
      }
      streetLines.forEach((coords) => placeAlong("street", coords));
      parkLines.forEach((coords) => placeAlong("park", coords));

      const models = [];
      const glows = [];

      function addGlow(kind, lon, lat) {
        glows.push({
          type: "Feature",
          properties: { kind, r: LAMP_KINDS[kind].radius },
          geometry: { type: "Point", coordinates: [lon, lat] },
        });
      }

      function addStreetLamp({ lon, lat, ux, uy, side }) {
        const shaftH = 7.4;
        const armReach = 2.4;
        const armRise = 1.1;
        const armSteps = 7;
        const dirx = uy * side;
        const diry = -ux * side;
        models.push(lampPart(squarePolygon(lon, lat, 0.7), "base", 0, 0.45));
        models.push(lampPart(squarePolygon(lon, lat, 0.3), "pole", 0.45, 3.2));
        models.push(lampPart(squarePolygon(lon, lat, 0.2), "pole", 3.2, shaftH + 0.1));
        let prevX = 0;
        let prevZ = shaftH;
        for (let i = 1; i <= armSteps; i++) {
          const ang = (i / armSteps) * (Math.PI / 2);
          const x = armReach * (1 - Math.cos(ang));
          const z = shaftH + armRise * Math.sin(ang);
          const mid = (prevX + x) / 2;
          const [cx, cy] = offsetLngLat(lon, lat, dirx * mid, diry * mid);
          models.push(lampPart(
            boxPolygon(cx, cy, dirx, diry, Math.max(0.22, x - prevX + 0.1), 0.12),
            "pole",
            Math.min(prevZ, z),
            Math.max(prevZ, z) + 0.1
          ));
          prevX = x;
          prevZ = z;
        }
        const [hLon, hLat] = offsetLngLat(lon, lat, dirx * (armReach + 0.3), diry * (armReach + 0.3));
        models.push(lampPart(ovalPolygon(hLon, hLat, dirx, diry, 1.05, 0.46), "bulb", prevZ - 0.22, prevZ - 0.02));
        models.push(lampPart(ovalPolygon(hLon, hLat, dirx, diry, 1.2, 0.56), "head", prevZ - 0.02, prevZ + 0.12));
        addGlow("street", hLon, hLat);
      }

      function addParkLamp({ lon, lat }) {
        models.push(lampPart(squarePolygon(lon, lat, 0.46), "base", 0, 0.3));
        models.push(lampPart(squarePolygon(lon, lat, 0.14), "pole", 0.3, 3.1));
        models.push(lampPart(squarePolygon(lon, lat, 0.3), "head", 3.05, 3.15));
        models.push(lampPart(squarePolygon(lon, lat, 0.4), "bulb", 3.15, 3.62));
        models.push(lampPart(squarePolygon(lon, lat, 0.56), "head", 3.62, 3.72));
        models.push(lampPart(squarePolygon(lon, lat, 0.3), "head", 3.72, 3.84));
        addGlow("park", lon, lat);
      }

      posts.forEach((post) => {
        if (post.kind === "street") addStreetLamp(post);
        else addParkLamp(post);
      });

      return {
        glows: { type: "FeatureCollection", features: glows },
        models: { type: "FeatureCollection", features: models },
      };
    }

    const PX_PER_METER_Z0 = 1 / ((40075016.686 * Math.cos((3.37415 * Math.PI) / 180)) / 512);

    function metersRadius(factor) {
      return [
        "interpolate", ["exponential", 2], ["zoom"],
        12, ["*", ["get", "r"], factor * PX_PER_METER_Z0 * 2 ** 12],
        22, ["*", ["get", "r"], factor * PX_PER_METER_Z0 * 2 ** 22],
      ];
    }

    const lampData = buildLamps(paths);
    let night = false;
    let cameraFitted = false;
    let styleBusy = true;
    const themeBtn = document.getElementById("theme-btn");

    function paintThemeButton() {
      themeBtn.textContent = night ? "Día" : "Noche";
      themeBtn.setAttribute("aria-pressed", night ? "true" : "false");
      document.body.dataset.theme = night ? "night" : "day";
    }

    function palette() {
      if (!night) {
        return {
          serviceCasing: "#cfcdca",
          serviceLine: "#ffffff",
          footCasing: "#d07c72",
          footLine: "#f4a89a",
          steps: "#e0897c",
          footprint: "#5b6672",
          buildings: [
            "library", "#e8eef1",
            "food", "#efe8de",
            "culture", "#ebe6ea",
            "sport", "#e2ebe5",
            "tower", "#d0cbc3",
            "mid", "#ddd8d0",
            "#e7e2d9",
          ],
          label: "#3a424c",
          labelHalo: "rgba(248,250,252,0.94)",
          passageCasing: "#ffffff",
          passageLine: "#6d5b95",
          lampMetal: "#3b3f45",
          lampHead: "#2a2d32",
          lampBulb: "#f1eee4",
          campusBuilding: "#e7e2d9",
        };
      }
      return {
        serviceCasing: "#0a0e14",
        serviceLine: "#3e4859",
        footCasing: "#0a0e14",
        footLine: "#d2b183",
        steps: "#d0a773",
        footprint: "#04070b",
        buildings: [
          "library", "#7d8798",
          "food", "#8a8074",
          "culture", "#847c8c",
          "sport", "#748680",
          "tower", "#6e7686",
          "mid", "#787f90",
          "#808898",
        ],
        label: "#f1ede4",
        labelHalo: "rgba(6,9,14,0.92)",
        passageCasing: "#141a26",
        passageLine: "#a898e0",
        lampMetal: "#5a616c",
        lampHead: "#262a31",
        lampBulb: "#fff6d8",
        campusBuilding: "#808898",
      };
    }

    const NIGHT_BASE = {
      background: { "background-color": "#070b12" },
      landcover_wood: { "fill-color": "#0c1512" },
      landuse_park: { "fill-color": "#0d1613" },
      landuse_residential: { "fill-color": "#0b1018" },
      water: { "fill-color": "#08131f" },
      waterway: { "line-color": "#0a1828" },
      building: { "fill-color": "#111722", "fill-outline-color": "#1c2330" },
      highway_path: { "line-opacity": 0 },
      highway_minor: { "line-color": "#171d27" },
      highway_major_casing: { "line-color": "#262e3b" },
      highway_major_inner: { "line-color": "#1a2029" },
      highway_name_other: { "text-color": "#9aa4b3", "text-halo-color": "#05080d", "text-halo-width": 1.4 },
      highway_name_motorway: { "text-color": "#9aa4b3" },
    };

    function tuneNightBase() {
      Object.entries(NIGHT_BASE).forEach(([id, paint]) => {
        if (!map.getLayer(id)) return;
        Object.entries(paint).forEach(([prop, value]) => {
          try { map.setPaintProperty(id, prop, value); } catch (_) {}
        });
      });
    }

    function removeIfPresent(ids, kind) {
      ids.forEach((id) => {
        if (kind === "layer" && map.getLayer(id)) map.removeLayer(id);
        if (kind === "source" && map.getSource(id)) map.removeSource(id);
      });
    }

    function addCampusOverlays() {
      const colors = palette();
      const layers = map.getStyle().layers || [];
      let beforeId;
      for (let i = 0; i < layers.length; i++) {
        if (layers[i].type === "symbol") {
          beforeId = layers[i].id;
          break;
        }
      }

      [
        "road_path_pedestrian",
        "tunnel_path_pedestrian",
        "bridge_path_pedestrian",
        "bridge_path_pedestrian_casing",
      ].forEach((id) => {
        if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
      });

      removeIfPresent([
        "lamp-bulb", "lamp-3d", "lamp-core", "lamp-glow", "lamp-pool",
        "buildings-labels", "buildings-3d", "campus-building-3d", "buildings-footprint",
        "pasillos-line", "pasillos-casing",
        "steps-line", "foot-line", "foot-casing", "service-line", "service-casing",
      ], "layer");
      removeIfPresent(["lamp-models", "lamps", "pasillos", "buildings", "paths"], "source");

      const serviceFilter = ["==", ["get", "highway"], "service"];
      const footFilter = ["match", ["get", "highway"], ["footway", "path", "pedestrian", "bridleway"], true, false];
      const stepsFilter = ["==", ["get", "highway"], "steps"];

      map.addSource("paths", { type: "geojson", data: paths });
      map.addLayer({
        id: "service-casing", type: "line", source: "paths",
        filter: serviceFilter,
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": colors.serviceCasing,
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 2.4, 17, 5.2, 19, 8.5],
        },
      }, beforeId);
      map.addLayer({
        id: "service-line", type: "line", source: "paths",
        filter: serviceFilter,
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": colors.serviceLine,
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 1.4, 17, 3.4, 19, 6],
        },
      }, beforeId);
      map.addLayer({
        id: "foot-casing", type: "line", source: "paths",
        filter: footFilter,
        layout: { "line-cap": night ? "round" : "butt", "line-join": "round" },
        paint: {
          "line-color": colors.footCasing,
          ...(night ? {} : { "line-dasharray": [2, 1.5] }),
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 1.8, 17, 3.4, 19, 5.0],
          "line-opacity": night ? 0.75 : 0.9,
        },
      }, beforeId);
      map.addLayer({
        id: "foot-line", type: "line", source: "paths",
        filter: footFilter,
        layout: { "line-cap": "butt", "line-join": "round" },
        paint: {
          "line-color": colors.footLine,
          "line-dasharray": [2, 1.5],
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 1.2, 17, 2.2, 19, 3.0],
          "line-opacity": 0.98,
        },
      }, beforeId);
      map.addLayer({
        id: "steps-line", type: "line", source: "paths",
        filter: stepsFilter,
        layout: { "line-cap": "butt", "line-join": "round" },
        paint: {
          "line-color": colors.steps,
          "line-dasharray": [0.5, 0.4],
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 1.6, 17, 2.6, 19, 3.4],
        },
      }, beforeId);

      const lampVisibility = night ? "visible" : "none";
      const lampTint = ["match", ["get", "kind"], "street", "#ffb45e", "#ffcf8a"];
      map.addSource("lamps", { type: "geojson", data: lampData.glows });
      map.addLayer({
        id: "lamp-pool", type: "circle", source: "lamps",
        layout: { visibility: lampVisibility },
        paint: {
          "circle-radius": metersRadius(1),
          "circle-color": lampTint,
          "circle-opacity": ["interpolate", ["linear"], ["zoom"], 14, 0.18, 17, 0.36],
          "circle-blur": 1,
          "circle-pitch-alignment": "map",
          "circle-pitch-scale": "map",
        },
      }, beforeId);
      map.addLayer({
        id: "lamp-glow", type: "circle", source: "lamps",
        layout: { visibility: lampVisibility },
        paint: {
          "circle-radius": metersRadius(0.5),
          "circle-color": "#ffd79a",
          "circle-opacity": ["interpolate", ["linear"], ["zoom"], 14, 0.24, 17, 0.4],
          "circle-blur": 0.9,
          "circle-pitch-alignment": "map",
          "circle-pitch-scale": "map",
        },
      }, beforeId);
      map.addLayer({
        id: "lamp-core", type: "circle", source: "lamps",
        layout: { visibility: lampVisibility },
        paint: {
          "circle-radius": metersRadius(0.2),
          "circle-color": "#fff3d9",
          "circle-opacity": ["interpolate", ["linear"], ["zoom"], 14, 0.7, 17, 0.5],
          "circle-blur": 0.7,
          "circle-pitch-alignment": "map",
          "circle-pitch-scale": "map",
        },
      }, beforeId);

      if (!map.getLayer("building-3d") && map.getSource("openmaptiles")) {
        map.addLayer({
          id: "campus-building-3d",
          type: "fill-extrusion",
          source: "openmaptiles",
          "source-layer": "building",
          minzoom: 14,
          filter: ["all",
            ["!=", ["get", "hide_3d"], true],
            [">", ["coalesce", ["get", "render_height"], 0], 0],
          ],
          paint: {
            "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
            "fill-extrusion-color": night
              ? ["interpolate", ["linear"], ["coalesce", ["get", "render_height"], 6], 4, "#747c8e", 16, "#868e9f", 36, "#9aa2b2"]
              : colors.campusBuilding,
            "fill-extrusion-height": ["coalesce", ["get", "render_height"], 0],
            "fill-extrusion-opacity": 1,
            "fill-extrusion-vertical-gradient": !night,
          },
        }, beforeId);
      }
      if (night) {
        tuneNightBase();
        if (map.getLayer("building")) map.setLayoutProperty("building", "visibility", "none");
      }

      map.addSource("buildings", { type: "geojson", data: buildings, promoteId: "fid" });
      map.addLayer({
        id: "buildings-footprint", type: "fill", source: "buildings",
        filter: [">", ["coalesce", ["get", "height_m"], 0], 0],
        paint: {
          "fill-color": colors.footprint,
          "fill-opacity": night ? 0 : 0.14,
          "fill-translate": [2, 4],
        },
      }, beforeId);
      map.addLayer({
        id: "buildings-3d", type: "fill-extrusion", source: "buildings",
        filter: [">", ["coalesce", ["get", "height_m"], 0], 0],
        paint: {
          "fill-extrusion-color": ["match", ["get", "tone"], ...colors.buildings],
          "fill-extrusion-height": ["get", "height_m"],
          "fill-extrusion-base": 0,
          "fill-extrusion-opacity": night ? 1 : 0.96,
          "fill-extrusion-vertical-gradient": !night,
        },
      }, beforeId);

      map.addSource("lamp-models", { type: "geojson", data: lampData.models });
      map.addLayer({
        id: "lamp-3d",
        type: "fill-extrusion",
        source: "lamp-models",
        layout: { visibility: lampVisibility },
        filter: ["!=", ["get", "part"], "bulb"],
        paint: {
          "fill-extrusion-color": ["match", ["get", "part"], "head", colors.lampHead, colors.lampMetal],
          "fill-extrusion-base": ["get", "base"],
          "fill-extrusion-height": ["get", "height"],
          "fill-extrusion-opacity": 1,
          "fill-extrusion-vertical-gradient": true,
        },
      }, beforeId);
      map.addLayer({
        id: "lamp-bulb",
        type: "fill-extrusion",
        source: "lamp-models",
        layout: { visibility: lampVisibility },
        filter: ["==", ["get", "part"], "bulb"],
        paint: {
          "fill-extrusion-color": colors.lampBulb,
          "fill-extrusion-base": ["get", "base"],
          "fill-extrusion-height": ["get", "height"],
          "fill-extrusion-opacity": 1,
          "fill-extrusion-vertical-gradient": false,
        },
      }, beforeId);

      map.addLayer({
        id: "buildings-labels", type: "symbol", source: "buildings",
        minzoom: 16.2,
        layout: {
          "text-field": ["coalesce", ["get", "label"], ""],
          "text-size": ["interpolate", ["linear"], ["zoom"], 16.2, 10, 18, 12.5],
          "text-anchor": "center",
          "text-max-width": 8,
          "text-allow-overlap": false,
          "symbol-sort-key": ["*", -1, ["coalesce", ["get", "height_m"], 0]],
        },
        paint: {
          "text-color": colors.label,
          "text-halo-color": colors.labelHalo,
          "text-halo-width": 1.5,
        },
      });

      if (passages.features && passages.features.length) {
        map.addSource("pasillos", { type: "geojson", data: passages });
        map.addLayer({
          id: "pasillos-casing", type: "line", source: "pasillos",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": colors.passageCasing,
            "line-width": ["interpolate", ["linear"], ["zoom"], 15, 4.5, 17, 6, 19, 7.5],
            "line-opacity": 0.92,
          },
        });
        map.addLayer({
          id: "pasillos-line", type: "line", source: "pasillos",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: {
            "line-color": colors.passageLine,
            "line-width": ["interpolate", ["linear"], ["zoom"], 15, 2.4, 17, 3.4, 19, 4.2],
            "line-opacity": 0.95,
          },
        });
      }

      map.setLight({
        anchor: "map",
        color: night ? "#d5deee" : "#ffffff",
        intensity: night ? 0.32 : 0.5,
        position: [1.15, night ? 150 : 210, night ? 18 : 55],
      });
      if (!cameraFitted) {
        map.fitBounds(
          [[-76.53756, 3.36814], [-76.52904, 3.38015]],
          { padding: 48, pitch: 58, bearing: -28, duration: 0 }
        );
        cameraFitted = true;
      }

      styleBusy = false;
      themeBtn.disabled = false;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: DAY_STYLE,
      center: [-76.5333, 3.37415],
      zoom: 16.2,
      pitch: 58,
      bearing: -28,
      maxPitch: 75,
      canvasContextAttributes: { antialias: true },
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-left");
    map.on("style.load", addCampusOverlays);

    themeBtn.addEventListener("click", () => {
      if (styleBusy) return;
      styleBusy = true;
      themeBtn.disabled = true;
      night = !night;
      paintThemeButton();
      map.setStyle(night ? NIGHT_STYLE : DAY_STYLE, { diff: false });
    });

  </script>
</body>
</html>
